name: Desktop source checks
on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/versions
        id: versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Check shared tracker
        run: |
          node desktop/tracker.test.mjs
          node tests/contrast.test.mjs
      - name: Check laboratory scripts
        run: |
          python3 -m py_compile desktop/*.py tests/desktop/*.py
          bash -n tests/desktop/audio-session.sh tests/desktop/desktop.sh
      - name: Package desktop frontends
        run: python3 desktop/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalipso-desktop-packages
          path: |
            artifacts/packages/*.plasmoid
            artifacts/packages/*.zip
