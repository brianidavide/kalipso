name: Desktop source checks
on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:
  workflow_call: # Used by the release workflow.
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/versions
        id: versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Check shared tracker
        run: |
          python3 tools/sync-shared.py --check
          node desktop/tracker.test.mjs
          node tests/contrast.test.mjs
      - name: Install QML and GJS engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript qml6-module-qtquick-window qt6-declarative-dev-tools
      - name: Run the tracker in the Plasma (QML) and GNOME (GJS) engines
        run: python3 tests/script_runtimes.py /usr/lib/qt6/bin/qmltestrunner "$(command -v gjs)"
      - name: Check laboratory scripts
        run: |
          python3 -m py_compile desktop/*.py tests/*.py tests/fixtures/*.py
          bash -n desktop/install-gnome.sh tests/desktop/audio-session.sh tests/desktop/desktop.sh
      - name: Package desktop frontends
        run: python3 desktop/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalipso-desktop-packages
          path: |
            artifacts/packages/*.plasmoid
            artifacts/packages/*.zip
            artifacts/packages/*.kwinscript
  arch:
    # The Arch package (packaging/arch/kalipso-git) built from this commit and installed in a clean
    # Arch Linux container: what someone on Arch or EndeavourOS gets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build, check and install the Arch package
        run: |
          docker run --rm -v "$PWD:/src:ro" -e COMMIT="$(git rev-parse HEAD)" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-svg qt6-tools pipewire python hicolor-icon-theme namcap >/dev/null
            useradd -m builder
            install -d -o builder /home/builder/pkg
            cp /src/packaging/arch/kalipso-git/PKGBUILD /home/builder/pkg/
            sed -i "s|^source=.*|source=(\"kalipso::git+file:///src#commit=$COMMIT\")|" /home/builder/pkg/PKGBUILD
            chown -R builder /home/builder/pkg
            su builder -c "git config --global --add safe.directory \"*\" && cd ~/pkg && makepkg --noconfirm"
            namcap /home/builder/pkg/*.pkg.tar.zst || true
            pacman -U --noconfirm /home/builder/pkg/*.pkg.tar.zst >/dev/null
            for file in /usr/bin/kalipso /usr/bin/kalipso-engine /usr/bin/kalipso-voice-setup \
                /usr/share/dbus-1/services/io.github.brianidavide.Kalipso.Engine.service \
                /usr/share/applications/io.github.brianidavide.kalipso.desktop \
                /usr/share/plasma/plasmoids/io.github.brianidavide.kalipso/metadata.json \
                /usr/share/plasma/plasmoids/io.github.brianidavide.kalipso/contents/fonts/AtkinsonHyperlegibleNext-Regular.ttf \
                /usr/share/gnome-shell/extensions/kalipso@brianidavide.github.io/metadata.json \
                /usr/share/kwin/scripts/kalipso-companion/metadata.json; do
              test -e "$file" || { echo "Missing $file"; exit 1; }
            done
            QT_QPA_PLATFORM=offscreen kalipso --version
            kalipso-voice-setup --list-models
          '
