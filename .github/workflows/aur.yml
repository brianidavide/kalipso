name: AUR
# Publishes Kalipso's Arch packages to AUR: `kalipso` at a published version (called by the release
# workflow for 0.1 and every X.0), and `kalipso-git`, which builds the latest main (run by hand, or with
# each published version). Needs the secret AUR_SSH_KEY: the private SSH key of the AUR account that
# maintains the packages. Without it the job warns and stops; nothing else depends on it.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Published version, for example 1.0
        type: string
        required: true
    secrets:
      AUR_SSH_KEY:
        required: false
permissions:
  contents: read
jobs:
  aur:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write the PKGBUILDs
        run: |
          set -euo pipefail
          mkdir -p aur/kalipso-git
          git_version="$(sed -n 's/^project(Kalipso VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt).r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          sed "s/^pkgver=.*/pkgver=$git_version/" packaging/arch/kalipso-git/PKGBUILD > aur/kalipso-git/PKGBUILD
          if [ -n "$VERSION" ]; then
            mkdir -p aur/kalipso
            curl -fsSL -o source.tar.gz "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$VERSION.tar.gz"
            sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
            sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
              packaging/arch/kalipso/PKGBUILD > aur/kalipso/PKGBUILD
          fi
          grep -H "^pkgver=\|^sha256sums=" aur/*/PKGBUILD
      - name: Write .SRCINFO (makepkg in an Arch container)
        run: |
          docker run --rm -v "$PWD/aur:/aur" archlinux:base-devel bash -c \
            'useradd -m builder && chown -R builder /aur && for dir in /aur/*/; do su builder -c "cd $dir && makepkg --printsrcinfo > .SRCINFO"; done'
          sudo chown -R "$(id -u):$(id -g)" aur
          cat aur/*/.SRCINFO
      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::warning::No AUR_SSH_KEY secret: the AUR packages were not updated."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # Talk to AUR only: the Ed25519 fingerprint published on aur.archlinux.org.
          ssh-keyscan -t ed25519 aur.archlinux.org > /tmp/aur_host 2>/dev/null
          ssh-keygen -lf /tmp/aur_host | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
            || { echo "::error::Unexpected SSH fingerprint for aur.archlinux.org: not publishing."; exit 1; }
          cat /tmp/aur_host >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          for dir in aur/*/; do
            package=$(basename "$dir")
            git clone "ssh://aur@aur.archlinux.org/$package.git" "repo-$package"
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "repo-$package/"
            (
              cd "repo-$package"
              git config user.name "Kalipso release"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then echo "$package is already up to date"; exit 0; fi
              git commit -m "$(grep '^pkgver=' PKGBUILD | cut -d= -f2)"
              git push origin HEAD:master
            )
          done
