name: Release
# Pushing a tag such as v0.2.0 builds every package and creates a *draft*
# GitHub release with SHA256SUMS. A maintainer reviews and publishes it.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-tools-dev libpipewire-0.3-dev pkg-config dpkg-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(Kalipso VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Package
        run: cd build && cpack -G "DEB;TGZ"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalipso-linux
          path: |
            build/kalipso_*.deb
            build/kalipso-*.tar.gz
  platforms:
    uses: ./.github/workflows/platforms.yml
  desktop:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [linux, platforms, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir downloads
          mkdir dist
          cp downloads/kalipso-linux/* dist/
          cp downloads/kalipso-desktop-packages/* dist/
          cp downloads/kalipso-macos-26/kalipso-macos.tar.gz "dist/kalipso-$GITHUB_REF_NAME-macos-arm64.tar.gz"
          (cd downloads/kalipso-windows-2022/kalipso && zip -qr "$GITHUB_WORKSPACE/dist/kalipso-$GITHUB_REF_NAME-windows-x64.zip" .)
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Kalipso $GITHUB_REF_NAME" \
            --notes "Development preview. Packages are unsigned; verify downloads with SHA256SUMS. Installation: https://github.com/brianidavide/kalipso#install"
