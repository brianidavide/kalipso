name: Native build and tests
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        qt: [distribution, latest-stable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/versions
        id: versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Check source distribution
        run: python3 tools/check-repository.py
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-tools-dev libpipewire-0.3-dev pkg-config pipewire-bin wireplumber gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-plugins-base desktop-file-utils appstream dbus-x11 libglib2.0-bin gjs qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick qt6-declarative-dev-tools qt6-qpa-plugins xvfb xauth
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: matrix.qt == 'latest-stable'
        with:
          version: ${{ steps.versions.outputs.qt }}
          aqtversion: ==${{ steps.versions.outputs.aqt }}
          host: linux
          arch: linux_gcc_64
          cache: true
      - name: Install pinned CMake
        run: python -m pip install cmake==${{ steps.versions.outputs.cmake }}
      - name: Configure
        # QT_ROOT_DIR is set only by the latest-stable Qt installer; the distribution lane uses system Qt.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ${QT_ROOT_DIR:+-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR}
      - name: Confirm the Qt version under test
        run: grep -E "^Qt6_DIR" build/CMakeCache.txt
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: UI tests on a real X11 server
        # Offscreen tests skip real screen sampling; run the whole suite on X11 too.
        if: matrix.qt == 'distribution'
        run: xvfb-run -a -s '-screen 0 1280x900x24' env QT_QPA_PLATFORM=xcb build/ui_tests
      - name: Check ASR benchmark metrics
        run: |
          python3 -m unittest discover -s benchmarks/asr -p 'test_*.py'
          python3 -m py_compile benchmarks/asr/*.py
          cmake -S benchmarks/asr -B build-asr-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-asr-check --parallel 2
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/*.desktop
          appstreamcli validate --no-net packaging/*.metainfo.xml
      - name: Smoke test
        run: QT_QPA_PLATFORM=offscreen build/kalipso --demo --prompter --quit-after 1000
      - name: Verify design token generation
        run: |
          python3 tools/generate-design-tokens.py
          git diff --exit-code -- design src/design_tokens.h src/icons/generated site/assets/tokens.css site/assets/tokens.json site/assets/mark.svg site/assets/tracker.mjs site/assets/unicode-tokens.mjs desktop/gnome/tokens.js desktop/gnome/stylesheet.css desktop/plasma/contents/ui/Tokens.js packaging/io.github.brianidavide.kalipso.svg
      - name: Install to staging
        run: DESTDIR="$PWD/artifacts/stage" cmake --install build --prefix /usr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-development-build-${{ matrix.qt }}
          path: artifacts/stage
