name: macOS and Windows
on:
  push:
    branches: [main, feature/system-speech]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            host: mac
            arch: clang_64
            qt: 6.10.3
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            qt: 6.8.3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Collect runtime notices
        run: python tools/package-qt-notices.py ${{ matrix.qt }} artifacts/runtime-notices
      - name: macOS bundle
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/kalipso.app
          mkdir -p build/kalipso.app/Contents/Resources/licenses
          cp -R artifacts/runtime-notices/. build/kalipso.app/Contents/Resources/licenses/
          codesign --force --deep --sign - --entitlements packaging/macos/entitlements.plist build/kalipso.app
          build/kalipso.app/Contents/MacOS/kalipso --demo --quit-after 1000
          mkdir -p artifacts
          tar -czf artifacts/kalipso-macos.tar.gz -C build kalipso.app
      - name: Windows package
        if: runner.os == 'Windows'
        run: |
          cmake --install build --config Release --prefix artifacts/kalipso
          windeployqt --release artifacts/kalipso/bin/kalipso.exe
          Copy-Item -Recurse artifacts/runtime-notices artifacts/kalipso/share/licenses/third-party
      - uses: actions/upload-artifact@v4
        with:
          name: kalipso-${{ matrix.os }}
          path: |
            artifacts/kalipso-macos.tar.gz
            artifacts/kalipso
