name: macOS and Windows
on:
  push:
    branches: [main, feature/system-speech]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            host: mac
            arch: clang_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: macOS bundle
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/kalipso.app
          codesign --force --deep --sign - --entitlements packaging/macos/entitlements.plist build/kalipso.app
          build/kalipso.app/Contents/MacOS/kalipso --demo --quit-after 1000
      - name: Windows package
        if: runner.os == 'Windows'
        run: |
          cmake --install build --config Release --prefix artifacts/kalipso
          windeployqt --release artifacts/kalipso/bin/kalipso.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kalipso-${{ matrix.os }}
          path: |
            build/kalipso.app
            artifacts/kalipso
